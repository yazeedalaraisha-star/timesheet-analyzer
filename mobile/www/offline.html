<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>لا يوجد اتصال</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        font-family: "Cairo", "Tajawal", system-ui, sans-serif; color: #ececec;
        background:
          radial-gradient(40rem 28rem at 85% -10%, rgba(182,255,0,.22), transparent 60%),
          radial-gradient(36rem 26rem at -10% 40%, rgba(120,200,0,.08), transparent 60%),
          linear-gradient(180deg, #111111, #0A0A0A);
      }
      .card {
        width: 100%; max-width: 360px; text-align: center; padding: 32px 24px; border-radius: 28px;
        background: rgba(28,28,28,.55); border: 1px solid rgba(255,255,255,.09);
        -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 40px -12px rgba(0,0,0,.6);
        animation: pop .45s cubic-bezier(.32,.72,0,1);
      }
      .icon {
        width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px; display: grid; place-items: center;
        background: rgba(182,255,0,.14); color: #B6FF00;
      }
      h1 { font-size: 18px; margin: 0 0 8px; color: #fff; }
      p { font-size: 13px; line-height: 1.8; margin: 0 0 24px; color: #b0b0b0; }
      button {
        width: 100%; padding: 14px; border: 0; border-radius: 16px; font: inherit; font-weight: 700; font-size: 15px;
        background: #B6FF00; color: #111111; box-shadow: 0 8px 24px -8px rgba(182,255,0,.6);
        transition: transform .18s cubic-bezier(.32,.72,0,1);
      }
      button:active { transform: scale(.96); }
      @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(12px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></svg>
      </div>
      <h1>تعذّر الاتصال بالخادم</h1>
      <p>تأكد من اتصالك بالإنترنت ثم أعد المحاولة. قد يستغرق الخادم بضع ثوانٍ ليستيقظ في أول فتح.</p>
      <button type="button" onclick="location.replace('https://timesheet-analyzer.onrender.com/')">إعادة المحاولة</button>
    </div>
    <script>
      window.addEventListener('online', function () { location.replace('https://timesheet-analyzer.onrender.com/'); });
    </script>
  </body>
</html>
